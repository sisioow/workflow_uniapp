spring:
  application:
    name: workflow-uniapp

  datasource:
    url: jdbc:mysql://localhost:3306/workflow_uniapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # --- H2 开发模式（无需 MySQL 时启用）---
  # datasource:
  #   url: jdbc:h2:file:./.runtime/workflow;DB_CLOSE_DELAY=-1
  #   driver-class-name: org.h2.Driver
  # h2:
  #   console:
  #     enabled: true

server:
  port: 8765

# --- 外部服务配置 ---
workflow:
  llm:
    provider: openai
    base-url: http://192.168.100.231:8080/v1
    api-key: ${LLM_API_KEY:}
    model: deepseek/deepseek-v4-flash

  stitch:
    mcp-url: https://stitch.googleapis.com/mcp
    api-key: ${STITCH_API_KEY:}
    oauth-token: ${STITCH_OAUTH_TOKEN:}
    oauth-client-id: ${STITCH_OAUTH_CLIENT_ID:}
    oauth-client-secret: ${STITCH_OAUTH_CLIENT_SECRET:}

  codex:
    bin: codex
    model: ${CODEX_MODEL:}
    sandbox: workspace-write
    timeout-minutes: 60

  paths:
    uniapp-template-dir: ${UNIAPP_TEMPLATE_DIR:/Users/shihongwei/n8n/uniapp/uniapp_base}
    uniapp-output-dir: ${UNIAPP_OUTPUT_DIR:/Users/shihongwei/n8n/uniapp}
